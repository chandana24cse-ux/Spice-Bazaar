<!DOCTYPE html>
<html>
<head>
    <title>Contact Info</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff8f0;
            text-align: center;
            margin: 0;
        }

        h1 {
            background-color: maroon;
            color: white;
            padding: 10px;
        }

        .card {
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        p {
            margin: 10px 0;
            font-size: 16px;
        }

        .label {
            font-weight: bold;
            color: maroon;
        }

        
        @media (max-width: 600px) {
            .card {
                width: 90%;
            }
        }
    </style>

</head>

<body>

    <h1> Contact Us</h1>

    <div class="card">
        <p><span class="label">Shop Name:</span> Spice Bazaar</p>
        <p><span class="label">Phone:</span> +918179102880 </p>
        <p><span class="label">Email:</span> chandu@gmail.com</p>
        <p><span class="label">Address:</span> Bangalore, India</p>
    </div>

</body>
</html>
