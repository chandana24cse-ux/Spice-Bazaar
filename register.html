<!DOCTYPE html>
<html>
    <head>
        <title>Spice Bazaar Registration</title>
<style>

body{
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

form{
    background-color: white;
    padding: 30px;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px lightgray;
}

h2{
    text-align: center;
    color: maroon;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"]{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: 1px solid gray;
    border-radius: 5px;
    box-sizing: border-box;
}

input[type="submit"]{
    width: 100%;
    background-color: maroon;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}

input[type="submit"]:hover{
    background-color: black;
}

</style>
    </head>
    <body>

<form action="register.php" method="post">
    <h2>Spice Bazaar Registration</h2>


Name:<br>
<input type="text" name="name" required><br>

Email:<br>
<input type="email" name="email" required><br>

Password:<br>
<input type="password" name="password" required><br>

Phone:<br>
<input type="number" name="phone" required><br>

Address:<br>
<input type="text" name="address" required><br>

<input type="submit" value="Register">

</form>
    </body>
</html>
